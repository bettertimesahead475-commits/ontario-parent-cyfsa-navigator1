# TEMPLATE — NOT ACTIVE. Outside .github/workflows/ on purpose.
# Do not copy into .github/workflows/ until: (1) the downloader has passed independent review, (2) GitHub-hosted runner
# connectivity to ontariocourtforms.on.ca has been demonstrated in a run on a non-main branch, and (3) counsel has
# reviewed the temporary-copy question in docs/ci/OFFICIAL_FORMS_SOURCE_DECISION.md section 1.2.
name: Official-form fixtures (fetch from official source)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - name: Download retrievable fixtures from the official source (verified, fail closed)
        run: node scripts/official-forms/fetch-official.mjs --report "$RUNNER_TEMP/fetch-report.json"

      - name: Upload the status report only (no fixture bytes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-forms-fetch-report
          path: ${{ runner.temp }}/fetch-report.json
          if-no-files-found: ignore

      - name: Test with the retrievable fixtures required
        env:
          REQUIRE_OFFICIAL_FORMS_FIXTURES: retrievable
        run: npm test
