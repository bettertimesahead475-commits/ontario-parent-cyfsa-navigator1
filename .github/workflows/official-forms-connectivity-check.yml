# TEMPORARY verification workflow for draft/official-forms-audit only (runs on that branch's pushes, or manually).
# Purpose: show whether a GitHub-hosted runner can retrieve and verify the 11 retrievable official forms.
# It writes only to runner temporary folders, uploads nothing, caches nothing, and deploys nothing.
# It prints statuses and counts only. Delete this file once the connectivity result is recorded.
name: Official-form connectivity check (temporary)

on:
  workflow_dispatch:
  # GitHub accepts workflow_dispatch only for files on the default branch, so this branch-scoped push trigger starts the run.
  push:
    branches: [draft/official-forms-audit]

permissions:
  contents: read

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download and verify the 11 retrievable forms into temporary folders
        run: |
          node scripts/official-forms/fetch-official.mjs \
            --historical-target "$RUNNER_TEMP/official-historical" \
            --current-target "$RUNNER_TEMP/official-current" \
            --report "$RUNNER_TEMP/fetch-report.json"

      - name: Summarise statuses and counts (no file content)
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/fetch-report.json" ]; then
            node -e 'const r=require(process.argv[1]); const c={}; for (const x of r.rows) c[x.status]=(c[x.status]||0)+1; console.log(JSON.stringify({ok:r.ok,written:r.written,rows:r.rows.length,counts:c}))' "$RUNNER_TEMP/fetch-report.json"
          else
            echo "no report was written"
          fi
