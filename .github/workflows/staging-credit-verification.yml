name: Staging credit verification

# Manual only. Runs the six staging integration scenarios against the staging Supabase project.
# It never runs on push or pull request, and it never touches production.
#
# Only the commit pinned below is ever checked out and run with staging secrets. To verify a different
# commit, change APPROVED_COMMIT_SHA through a reviewed PR to main. The pin is the approval record.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-credit-verification
  cancel-in-progress: false

env:
  # Head of PR #103 (fix/credit-atomic-claim) that this run verifies. Immutable: a full 40-character SHA.
  APPROVED_COMMIT_SHA: c59a3f5aa20577d35c74a986cbfc53acc44bd69c
  # The only Supabase URL the run will use. A single trailing slash is tolerated; nothing else.
  EXPECTED_STAGING_URL: https://nxfhvebzzobegubefcda.supabase.co
  EXPECTED_SCENARIO_COUNT: "6"

jobs:
  staging-integration:
    name: Six staging scenarios
    runs-on: ubuntu-latest
    # Secrets live in the "staging" environment. Its required reviewers must approve each run, and its
    # deployment branches must be restricted to main, so this workflow is the only thing that can read them.
    environment: staging
    timeout-minutes: 15
    steps:
      # Runs before any repository code is checked out. It reads only the two secrets and the pinned URL.
      - name: Validate staging configuration
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$APPROVED_COMMIT_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::APPROVED_COMMIT_SHA is not a full 40-character lowercase commit SHA."
            exit 1
          fi
          if [ -z "${STAGING_SUPABASE_URL:-}" ]; then
            echo "::error::STAGING_SUPABASE_URL is not set in the staging environment."
            exit 1
          fi
          if [ -z "${STAGING_SUPABASE_SERVICE_ROLE_KEY:-}" ]; then
            echo "::error::STAGING_SUPABASE_SERVICE_ROLE_KEY is not set in the staging environment."
            exit 1
          fi
          # Exact match after removing one trailing slash. Any other host, port, path, query or userinfo is rejected.
          url="${STAGING_SUPABASE_URL%/}"
          if [ "$url" != "$EXPECTED_STAGING_URL" ]; then
            echo "::error::STAGING_SUPABASE_URL must be exactly $EXPECTED_STAGING_URL (a trailing slash is allowed). Refusing to run."
            exit 1
          fi

      # The workflow file comes from main. The code under test is the pinned commit only.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.APPROVED_COMMIT_SHA }}
          persist-credentials: false

      - name: Confirm the checkout is the approved commit
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$APPROVED_COMMIT_SHA" ]; then
            echo "::error::Checked out $actual, expected $APPROVED_COMMIT_SHA."
            exit 1
          fi
          echo "Testing approved commit $actual"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      # Dependency install runs without staging secrets.
      - run: npm ci

      - name: Run the six staging scenarios
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
        run: npx vitest run api/services/creditStaging.test.ts --reporter=json --outputFile=staging-results.json

      - name: Confirm all six scenarios actually executed and passed
        if: always()
        run: node scripts/check-staging-results.mjs staging-results.json

      - name: Keep the scenario report with the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-credit-results
          path: staging-results.json
          if-no-files-found: warn
          retention-days: 30
