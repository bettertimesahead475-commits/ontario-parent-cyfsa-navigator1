name: CI

on:
  push:
    branches: [main, feature/durable-analyzer-queue-20261104]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # A disposable PostgreSQL for the *.pg.test.ts suites (359 tests that otherwise skip). It lives only for this
    # job, holds only synthetic data, and the suites refuse any host other than 127.0.0.1/localhost.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: credit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Type-check
        run: npm run lint

      - name: Test
        env:
          NAVIGATOR_PG_TEST_ADMIN_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
          CREDIT_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/credit_test
        run: npm test

      - name: Build
        run: npm run build

      - name: Package staging Pages Functions
        if: github.ref == 'refs/heads/feature/durable-analyzer-queue-20261104'
        run: npx --yes wrangler@4 pages functions build functions --outdir=dist/_worker.js --build-output-directory=dist --compatibility-date=2026-11-04

      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/feature/durable-analyzer-queue-20261104'
        with:
          name: isolated-staging-pages-release
          path: dist
          retention-days: 3
