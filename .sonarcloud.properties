# Frozen oracle copies (tests/devin/fixtures) and test tables duplicate production code on purpose for differential tests.
# Migration rollback files must restore the complete prior function body, so they duplicate their forward migration by
# design (owner decision 2026-11-27). Duplication only: issues, security hotspots and forward migrations are still analyzed.
sonar.cpd.exclusions=tests/**,**/*.test.ts,**/*.test.tsx,supabase/**/*.rollback.sql,supabase/**/*.down.sql,supabase/**/rollback_*.sql
