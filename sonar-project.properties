# Used by the CI scan in .github/workflows/ci.yml (automatic analysis reads .sonarcloud.properties instead).
sonar.organization=bettertimesahead475-commits
sonar.projectKey=bettertimesahead475-commits_ontario-parent-cyfsa-navigator1
sonar.sources=src,shared,functions,api,workers
sonar.tests=src,shared,functions,api,workers,eval,tests
# Test files and test-only helpers are tests wherever they sit; everything else under sonar.sources is production code.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,api/testSupport/**,tests/**,eval/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,api/testSupport/**
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Frozen oracle copies (tests/devin/fixtures) and test tables duplicate production code on purpose for differential tests.
sonar.cpd.exclusions=tests/**,**/*.test.ts,**/*.test.tsx
